<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Modern Calculator</title>

  <link rel="stylesheet" href="stylesheet.css">
</head>

<body>

  <main class="app">

    <!-- Calculator -->
    <section class="calculator">

      <div class="display">
        <div id="expression"></div>
        <div id="display">0</div>
      </div>

      <div class="buttons">

        <button onclick="clearDisplay()" class="function">AC</button>
        <button onclick="deleteLast()" class="function">⌫</button>
        <button onclick="append('%')" class="function">%</button>
        <button onclick="append('/')" class="operator">÷</button>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button onclick="append('*')" class="operator">×</button>

        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button onclick="append('-')" class="operator">−</button>

        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button onclick="append('+')" class="operator">+</button>

        <button onclick="append('0')" class="zero">0</button>
        <button onclick="append('.')">.</button>
        <button onclick="calculate()" class="equals">=</button>

      </div>

    </section>


    <!-- History -->
    <aside class="history">

      <div class="history-header">
        <h2>History</h2>
        <button onclick="clearHistory()" class="clear-history">
          Clear
        </button>
      </div>

      <div id="historyList">
        <p class="empty-history">No calculations yet</p>
      </div>

    </aside>

  </main>

  <script src="script.js"></script>

</body>
</html>
